  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));

      /* ------------------------------------------------------------------
         Build the network of homes (seeded, deterministic): 13 x 5, hero = col 6,row 2
      ------------------------------------------------------------------ */
      let seed = 11;
      const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      const GREEN = "#35d39a", AMBER = "#f0a81a";
      const grid = $("#s07-business-grid");
      const cells = [];
      const homeSvg = (col, id) =>
        '<svg viewBox="0 0 100 100" fill="none"><circle class="s7-ring" cx="50" cy="50" r="43" stroke="' + col + '" stroke-width="5" stroke-linecap="round" transform="rotate(-90 50 50)"/>' +
        '<path d="M28 52 50 32l22 20" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M33 49v20h34V49" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M46 69V57h8v12" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 13; c++) {
          const hero = c === 6 && r === 2;
          const amber = !hero && rnd() < 0.13;
          const el = document.createElement("div");
          el.className = "s7-home";
          el.style.left = c * 140 + "px";
          el.style.top = r * 140 + "px";
          el.innerHTML = homeSvg(amber ? AMBER : GREEN);
          grid.appendChild(el);
          cells.push({ el, hero, amber, d: Math.hypot(c - 6, r - 2) });
        }
      }
      const heroCell = cells.find((x) => x.hero);
      const amberCells = cells.filter((x) => x.amber).slice(0, 7);

      /* dashboard tiles */
      const tileData = [
        ["Maple St · Home", "Seen 6 min ago", 0], ["Room 214", "Seen 11 min ago", 0], ["East wing", "All clear", 0], ["Unit 3B", "Seen 2 min ago", 0],
        ["Oak Ave · Home", "Seen 18 min ago", 0], ["Room 108", "Nothing yet today", 1], ["Garden level", "All clear", 0], ["Unit 5A", "Seen 9 min ago", 0],
        ["Cedar Ct · Home", "Seen 4 min ago", 0], ["Room 320", "Seen 15 min ago", 0], ["West wing", "All clear", 0], ["Unit 2C", "Seen 7 min ago", 0]
      ];
      const tiles = $("#s07-business-tiles");
      tileData.forEach((t) => {
        const col = t[2] ? AMBER : "#1f9d6b";
        const d = document.createElement("div");
        d.className = "s7-tile";
        d.innerHTML = '<svg viewBox="0 0 40 40" fill="none"><circle class="s7-tring" cx="20" cy="20" r="15" stroke="' + col + '" stroke-width="5" stroke-linecap="round" transform="rotate(-90 20 20)"/>' +
          (t[2] ? '<path d="M20 12v9M20 26v.5" stroke="' + col + '" stroke-width="3.5" stroke-linecap="round"/>' : '<path d="m13 20 5 5 9-10" stroke="' + col + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>') + '</svg>' +
          '<div class="s7-tn">' + t[0] + '</div><div class="s7-ts">' + t[1] + '</div>';
        tiles.appendChild(d);
      });
      const tileEls = $$(".s7-tile");
      const amberTile = tileEls[5];

      /* ------------------------------------------------------------------
         Timeline (SCENE-LOCAL seconds; abs = 106.5 + local)
      ------------------------------------------------------------------ */
      // initial states
      const others = cells.filter((x) => !x.hero).map((x) => x.el);
      gsap.set(others, { opacity: 0 });
      gsap.set("#s07-business-grid", { scale: 4, transformOrigin: "910px 350px" });
      gsap.set(["#s07-business-title", "#s07-business-stat", ".s7-card", "#s07-business-need", "#s07-business-desk", "#s07-business-dash",
              "#s07-business-cams", "#s07-business-flow", "#s07-business-sor", "#s07-business-underline", "#s07-business-proof"], { opacity: 0 });

      // 0.3-2.4  "This is bigger than one family."
      tl.fromTo(heroCell.el.querySelector(".s7-ring"), { strokeDasharray: 271, strokeDashoffset: 271 }, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 0.15);
      tl.fromTo("#s07-business-title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.4);

      // 2.2 zoom out to the network of homes
      tl.to("#s07-business-grid", { scale: 1, duration: 1.7, ease: "power3.inOut" }, 2.2);
      cells.filter((x) => !x.hero).forEach((x) => tl.to(x.el, { opacity: 1, duration: 0.55, ease: "power2.out" }, 2.45 + x.d * 0.1));

      // 3.0 -> "Three-quarters ... want to age at home" (spoken 3.17-6.07)
      tl.to("#s07-business-title", { opacity: 0, y: -22, duration: 0.4, ease: "power2.in" }, 2.85);
      tl.fromTo("#s07-business-stat", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.1);
      const cnt = { v: 0 }, numEl = $("#s07-business-statnum");
      tl.fromTo(cnt, { v: 0 }, { v: 75, duration: 1.3, ease: "power2.out", onUpdate: () => { numEl.textContent = Math.round(cnt.v) + "%"; } }, 3.15);

      // subtle, finite amber pulses across the network
      amberCells.forEach((x, i) => {
        tl.fromTo(x.el.querySelector("svg"), { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.22, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3 }, 4.0 + i * 0.28);
      });

      // 6.2 the network recedes; four cards flip in on their spoken names
      tl.to("#s07-business-grid", { opacity: 0.16, duration: 0.9, ease: "power2.inOut" }, 6.1);
      const flips = [6.4, 7.1, 8.6, 10.2];
      ["#s07-business-card1", "#s07-business-card2", "#s07-business-card3", "#s07-business-card4"].forEach((sel, i) => {
        const t0 = flips[i];
        tl.fromTo(sel, { opacity: 0, rotationY: -78, y: 34, transformPerspective: 1300, transformOrigin: "50% 50%" },

        tl.fromTo(sel, { boxShadow: "0 24px 60px rgba(0,0,0,.35), 0 0 0 0px rgba(57,183,238,0)" },
                       { boxShadow: "0 24px 60px rgba(0,0,0,.35), 0 0 0 7px rgba(57,183,238,.75)", duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + 0.55);
      });

      // 11.0 "... all need the same thing:"  -> shared-need rail
      tl.fromTo("#s07-business-need", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 11.05);
      tl.fromTo("#s07-business-rail", { strokeDasharray: 4000, strokeDashoffset: 4000 }, { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 11.1);
      tl.fromTo("#s07-business-pill", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 11.7);

      // 12.9 cards + stat exit
      tl.to([".s7-card"], { y: 70, opacity: 0, scale: 0.95, duration: 0.5, ease: "power2.in", stagger: 0.06 }, 12.85);
      tl.to(["#s07-business-need", "#s07-business-stat"], { opacity: 0, y: 20, duration: 0.45, ease: "power2.in" }, 12.85);

      tl.to("#s07-business-grid", { opacity: 0.05, duration: 0.6, ease: "power2.inOut" }, 13.0);

      // 13.2 "to know someone is safe ... without a human watching a screen."
      tl.set("#s07-business-desk", { opacity: 1 }, 13.15);
      tl.fromTo("#s07-business-cap1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.2);
      const scr = $$(".s7-scr");
      tl.fromTo(scr, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out", stagger: 0.09 }, 13.5);
      tl.fromTo("#s07-business-person", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 14.4);
      tl.fromTo("#s07-business-cap2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 14.75);
      // 16.2 "screen." -> the wall goes dark
      tl.to(scr.map((s) => s.querySelector(".s7-off")), { opacity: 0.93, duration: 0.55, ease: "power2.in", stagger: 0.05 }, 16.15);
      tl.to("#s07-business-person", { opacity: 0.25, duration: 0.5 }, 16.3);
      tl.to(["#s07-business-cap1", "#s07-business-cap2"], { opacity: 0, y: -18, duration: 0.45, ease: "power2.in" }, 16.55);

      // 16.7 paper reveal (circle wipe) -> calm dashboard
      tl.to("#s07-business-bg-paper", { clipPath: "circle(1500px at 960px 540px)", duration: 1.1, ease: "power2.inOut" }, 16.65);
      tl.set("#s07-business-desk", { opacity: 0 }, 17.9);
      tl.set(["#s07-business-dash", "#s07-business-cams", "#s07-business-flow"], { opacity: 1 }, 17.4);
      tl.fromTo("#s07-business-dash", { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 17.45);
      tileEls.forEach((t, i) => {
        tl.fromTo(t, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 17.9 + i * 0.07);
        tl.fromTo(t.querySelector(".s7-tring"), { strokeDasharray: 95, strokeDashoffset: 95 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 17.95 + i * 0.07);
      });

      // 18.5 "cameras that are already installed" -> camera column feeds the dashboard
      tl.fromTo("#s07-business-camcap", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 18.45);
      $$("#s07-business-cams .s7-ch").forEach((c, i) => tl.fromTo(c, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 18.55 + i * 0.16));
      ["#s07-business-f1", "#s07-business-f2", "#s07-business-f3"].forEach((f, i) => {
        tl.fromTo(f, { strokeDashoffset: 60, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.8, ease: "none" }, 19.05 + i * 0.12);
      });
      // Room 108 quietly asks for a check-in (finite pulse)
      tl.fromTo(amberTile, { boxShadow: "0 0 0 0px rgba(240,168,26,0)" }, { boxShadow: "0 0 0 6px rgba(240,168,26,.55)", duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, 19.9);

      // 21.15 "system of record"
      tl.to(["#s07-business-dash", "#s07-business-cams", "#s07-business-flow"], { opacity: 0.08, duration: 0.55, ease: "power2.inOut" }, 20.95);
      tl.set(["#s07-business-sor", "#s07-business-underline"], { opacity: 1 }, 21.1);
      tl.fromTo("#s07-business-sor span", { opacity: 0, y: 46, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 21.12);
      tl.fromTo("#s07-business-underline", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 21.55);
      // 22.5 "proof in every answer"
      tl.set("#s07-business-proof", { opacity: 1 }, 22.45);
      tl.fromTo("#s07-business-chip", { opacity: 0, y: 34, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.7)" }, 22.5);
      // hold + a very slow settle
      tl.to("#s07-business-sor", { scale: 1.025, transformOrigin: "50% 50%", duration: 3.0, ease: "none" }, 22.0);

      window.__timelines["s07-business"] = tl;
    })();
  </script>
