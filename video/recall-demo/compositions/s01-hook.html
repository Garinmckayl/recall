  <script>
    const tl = gsap.timeline({ paused: true });
    // FT = fromTo whose "from" is applied only when the tween starts (immediateRender:false): a seek straight into the middle of the scene is safe
    const FT = (t, a, b, pos) => tl.fromTo(t, a, { ...b, immediateRender: false }, pos);
    const Q = (s) => document.querySelector(s);

    // ---- helper: quick positional shake (seek-safe: explicit fromTo per step) ----
    function shake(sel, t, amp, n) {
      const step = 0.045;
      for (let i = 0; i < n; i++) {
        const a = amp * (1 - i / n) * (i % 2 ? -1 : 1);
        FT(sel, { x: a }, { x: -a * 0.6, duration: step - 0.002, ease: "none" }, t + i * step);
      }
      tl.set(sel, { x: 0 }, t + n * step);
    }

    // ================= PART 1 · the phone =================
    tl.set("#s01-p1", { opacity: 1 }, 0.2);
    FT("#s01-phonewrap", { opacity: 0, y: 30, rotation: -1.2 }, { opacity: 1, y: 0, rotation: -1.2, duration: 0.9, ease: "power2.out" }, 0.2);
    FT("#s01-tag", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.3);
    // slow creeping push on the phone through the whole beat (dread)
    FT("#s01-phonewrap", { scale: 0.88 }, { scale: 0.96, duration: 6.65, ease: "none" }, 0.2);
    // vibrate at the start
    shake("#s01-phonewrap", 0.15, 9, 10);

    // b-roll cutaways behind the phone
    FT("#s01-br1w", { opacity: 0 }, { opacity: 0.55, duration: 0.5, ease: "power1.out" }, 1.8);
    tl.to("#s01-br1w", { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.2);
    FT("#s01-br2w", { opacity: 0 }, { opacity: 0.55, duration: 0.4, ease: "power1.out" }, 4.4);
    tl.to("#s01-br2w", { opacity: 0, duration: 0.15, ease: "power1.in" }, 6.7);

    // notification stack: 2.3 / 3.4 / 4.5 / 5.4
    const badge = (n, t) => {
      FT("#s01-bd" + n, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, t);
      if (n > 1) tl.to("#s01-bd" + (n - 1), { opacity: 0, duration: 0.1 }, t);
      FT("#s01-nb" + n, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, t);
      if (n > 1) tl.to("#s01-nb" + (n - 1), { opacity: 0, duration: 0.12 }, t);
    };
    FT("#s01-ncard", { opacity: 0, y: -170, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 2.3);
    badge(1, 2.4);
    shake("#s01-phonewrap", 2.3, 7, 6);
    const bump = (t, peek, py) => {
      FT("#s01-ncard", { scale: 1 }, { scale: 1.05, duration: 0.09, ease: "power2.out" }, t);
      tl.to("#s01-ncard", { scale: 1, duration: 0.2, ease: "power2.inOut" }, t + 0.09);
      if (peek) FT(peek, { opacity: 0, y: 0, scale: 1 }, { opacity: 1, y: py, scale: py > 20 ? 0.9 : 0.95, duration: 0.3, ease: "power2.out" }, t);
    };
    bump(3.4, "#s01-peek1", 18); badge(2, 3.4); shake("#s01-phonewrap", 3.4, 8, 7);
    bump(4.5, "#s01-peek2", 36); badge(3, 4.5); shake("#s01-phonewrap", 4.5, 9, 8);
    bump(5.4, null, 0); badge(4, 5.4); shake("#s01-phonewrap", 5.4, 11, 10);
    FT("#s01-ncard", { boxShadow: "0 18px 40px rgba(0,0,0,.45)" }, { boxShadow: "0 0 0 3px rgba(229,72,77,.9), 0 0 60px rgba(229,72,77,.45)", duration: 0.35 }, 5.45);

    // kinetic type synced to v01_hook (It's 1.00 · eight-twenty 1.23 · eighty-one 3.07 · alone 4.60 · not 5.77 · answering 6.03)
    const punch = (sel, t, out, dx) => {
      FT(sel, { opacity: 0, scale: 1.28, x: dx, filter: "blur(10px)" }, { opacity: 1, scale: 1, x: 0, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, t);
      tl.to(sel, { opacity: 0, x: -dx * 0.4, duration: 0.22, ease: "power2.in" }, out);
    };
    punch("#s01-kA", 1.2, 2.25, -60);
    FT("#s01-kAsub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.55);
    tl.to("#s01-kAsub", { opacity: 0, duration: 0.2 }, 2.25);
    punch("#s01-kB", 3.05, 4.15, 60);
    FT("#s01-kBsub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 3.35);
    tl.to("#s01-kBsub", { opacity: 0, duration: 0.2 }, 4.15);
    punch("#s01-kC", 4.58, 5.55, -60);
    punch("#s01-kD1", 5.75, 6.8, 60);
    punch("#s01-kD2", 6.0, 6.8, 60);
    FT("#s01-kDline", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "expo.out" }, 6.25);

    // hard cut to black
    tl.set("#s01-p1", { opacity: 0 }, 6.85);
    tl.set("#s01-tag", { opacity: 0 }, 7.0);

    // ================= PART 2 · the real product =================
    // camera keyframes in 1920x1080 CSS px: x = 960 - cx*s, y = 540 - cy*s   (the page ends at y=1080; below it the wrapper shows paper)
    const K0  = { scale: 1.9,  x: -370,  y: -1170 };          // typing: chat input sits at ~3/4 height
    const K0b = { scale: 2.0,  x: -480,  y: -1360 };          // slow push while the question is typed
    const K1w = { scale: 1.55, x: -528,  y: -64.5 };          // after Enter: the chat bubble + "thinking" card
    const K1wb = { scale: 1.62, x: -587, y: -75.6 };          // tension creep while it thinks
    const K1  = { scale: 2.3,  x: -742,  y: -81 };            // answer card (whip in on the landing)
    const K2  = { scale: 3.0,  x: -3840, y: -135 };           // evidence video + tracking box
    const K3  = { scale: 2.6,  x: -3073, y: -1228 };          // path across the three cameras
    tl.set("#s01-camwrap", { opacity: 1 }, 7.2);
    FT("#s01-cam", K0, { ...K0b, duration: 1.35, ease: "none" }, 7.2);
    FT("#s01-cam", K0b, { ...K1w, duration: 0.4, ease: "power3.inOut" }, 8.55);
    FT("#s01-cam", K1w, { ...K1wb, duration: 0.6, ease: "none" }, 8.95);
    FT("#s01-cam", K1wb, { ...K1, duration: 0.3, ease: "expo.out" }, 9.55);
    FT("#s01-cam", K1, { scale: 2.36, x: -770, y: -84, duration: 0.3, ease: "none" }, 9.85);
    FT("#s01-cam", { scale: 2.36, x: -770, y: -84 }, { ...K2, duration: 0.45, ease: "power3.inOut" }, 10.15);
    FT("#s01-cam", K2, { scale: 3.06, x: -3925, y: -138, duration: 1.0, ease: "none" }, 10.6);
    FT("#s01-cam", { scale: 3.06, x: -3925, y: -138 }, { ...K3, duration: 0.5, ease: "power3.inOut" }, 11.62);
    // the cinematic vignette/grain would muddy the bright product UI: ease them back while it is on screen
    tl.set("#s01-vig", { opacity: 0.22 }, 7.2);
    tl.set("#s01-grain", { opacity: 0.03 }, 7.2);
    tl.set("#s01-vig", { opacity: 1 }, 12.6);
    tl.set("#s01-grain", { opacity: 0.075 }, 12.6);
    // impact at the answer landing (9.8): flash + micro-shake on the frame
    FT("#s01-flash", { opacity: 0.45 }, { opacity: 0, duration: 0.28, ease: "power2.out" }, 9.8);
    shake("#s01-camwrap", 9.8, 10, 8);

    // floating callouts (screen space)
    const pill = (sel, t, hold) => {
      FT(sel, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, t);
      tl.to(sel, { opacity: 0, duration: 0.15 }, t + hold);
    };
    pill("#s01-c1", 10.45, 1.3);
    pill("#s01-c2", 12.0, 0.6);
    pill("#s01-c3", 12.15, 0.45);

    // hard cut to black, then the title slam
    tl.set("#s01-camwrap", { opacity: 0 }, 12.6);
    FT("#s01-title", { opacity: 0, scale: 1.42 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.out" }, 13.0);
    shake("#s01-title", 13.02, 9, 8);
    FT("#s01-flash", { opacity: 0.55 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 13.0);
    FT("#s01-tbar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 13.22);
    FT("#s01-tsub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 13.4);

    window.__timelines["s01-hook"] = tl;
  </script>
