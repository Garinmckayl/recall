    const zA = 620 / 520;

    tl.to(camA, { y: -240 * zA, duration: 0.7, ease: "power2.inOut" }, 9.7);        // R1b: Kind/Clip/Emit
    tl.to(camA, { x: -1150 * zA, y: 0, duration: 0.7, ease: "power2.inOut" }, 11.0);  // R2: header status
