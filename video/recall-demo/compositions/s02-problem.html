  <script>
    const tl = gsap.timeline({ paused: true });
    // FT = fromTo whose "from" is applied only when the tween starts (immediateRender:false): a seek straight into the middle of the scene is safe
    const FT = (t, a, b, pos) => tl.fromTo(t, a, { ...b, immediateRender: false }, pos);
    const Q = (s) => document.querySelector(s);
    const O = 14.4;                              // scene start (absolute); everything below is written in ABSOLUTE seconds
    const T = (abs) => +(abs - O).toFixed(3);    // -> scene-local

    // ---------- build the wall (deterministic) ----------
    const THUMBS = ["evt_0034cb6802ea","evt_04e753ecf845","evt_14b758b4beb1","evt_1a494ca888ad","evt_1cf5a19a4243","evt_2e99bd3ce29a","evt_30e41296f4df",
      "evt_39d1a1cd8a9d","evt_3a7dd27c782e","evt_49acef75bee9","evt_6112336298af","evt_7b924ce86e1e","evt_81c44b46122e","evt_85fa2ba7ad53","evt_92530aeb2b71",
      "evt_9831ac782f27","evt_9dc70a188454","evt_bf39fee3f3c0","evt_dbd21e6f94c7","evt_e3f8ed22bdab","evt_e946ba9b7cd2"];
    const grid = Q("#s02-grid");
    for (let i = 0; i < 9 * 10; i++) {
      const d = document.createElement("div"); d.className = "s02-tile";
      d.style.backgroundImage = `url("assets/thumbs/${THUMBS[(i * 7 + (i >> 3)) % THUMBS.length]}.jpg")`;
      grid.appendChild(d);
    }
    const prev = Q("#s02-prev");
    for (let i = 0; i < 5; i++) {
      const d = document.createElement("div"); d.className = "s02-pv"; d.id = "s02-pv" + i;
      d.style.backgroundImage = `url("assets/thumbs/${THUMBS[(i * 5 + 2) % THUMBS.length]}.jpg")`;
      prev.appendChild(d);
    }
    const CAMS = ["Front Door", "Driveway", "Backyard", "Garage"];
    const toastTimes = [24.7,25.1,25.4,25.65,25.9,26.1,26.3,26.5,26.7,26.9,27.1,27.3,27.5,27.7,27.9,28.1,28.3,28.5];
    const toasts = Q("#s02-toasts");
    toastTimes.forEach((t, i) => {
      const d = document.createElement("div"); d.className = "s02-toast"; d.id = "s02-t" + i;
      d.style.top = (110 + (i % 7) * 112) + "px";
      d.innerHTML = `<i></i><div><b>Motion detected</b><span>${CAMS[i % 4]} · 8:${String(4 + (i * 3) % 50).padStart(2, "0")} PM</span></div>`;
      toasts.appendChild(d);
    });

    // ================= A · three stat rows (14.5 – 24.0) =================
    const rowIn = (sel, t) => {
      FT(sel, { opacity: 0, y: 46, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, T(t));
    };
    const countTo = (sel, to, t, dur, suffix) => {
      const o = { v: 0 }, el = Q(sel);
      FT(o, { v: 0 }, { v: to, duration: dur, ease: "power2.out", onUpdate() { el.textContent = Math.round(o.v) + suffix; } }, T(t));
    };
    rowIn("#s02-r1", 14.5); countTo("#s02-n1", 75, 14.6, 0.95, "%");
    rowIn("#s02-r2", 18.8);
    FT("#s02-n2", { opacity: 0.2, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, T(18.86));
    rowIn("#s02-r3", 21.0); countTo("#s02-n3", 30, 21.1, 1.35, "%");
    // "minutes matter" (22.59 – 23.74): the third row takes over, the others recede, a clock turns
    tl.to(["#s02-r1", "#s02-r2"], { opacity: 0.32, duration: 0.4, ease: "power2.out" }, T(22.5));
    tl.to("#s02-r3", { scale: 1.035, duration: 0.5, ease: "power2.out", boxShadow: "0 0 0 2px rgba(240,168,26,.85), 0 0 90px rgba(240,168,26,.35)" }, T(22.55));
    FT("#s02-clock", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, T(22.55));
    FT("#s02-hand", { rotation: 0, svgOrigin: "60 60" }, { rotation: 360, svgOrigin: "60 60", duration: 1.5, ease: "power1.inOut" }, T(22.6));
    // out
    tl.to(["#s02-r1", "#s02-r2", "#s02-r3"], { opacity: 0, y: -50, duration: 0.4, ease: "power2.in" }, T(23.95));

    // ================= B · the wall (24.5 – 34.0) =================
    FT("#s02-B", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, T(24.5));
    FT("#s02-grid", { y: 0 }, { y: -900, duration: 9.4, ease: "none" }, T(24.5));
    FT("#s02-persp", { scale: 1.0 }, { scale: 1.12, duration: 9.4, ease: "none" }, T(24.5));
    // counter
    const co = { v: 0 }, cv = Q("#s02-cval");
    FT("#s02-count", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, T(24.55));
    FT(co, { v: 0 }, { v: 412, duration: 8.8, ease: "power1.out", onUpdate() { cv.textContent = Math.round(co.v); } }, T(24.6));
    // motion-detected toasts, faster and faster
    toastTimes.forEach((t, i) => {
      const s = "#s02-t" + i;
      FT(s, { opacity: 0, x: 90, rotation: (i % 3 - 1) * 1.6 }, { opacity: 1, x: 0, rotation: (i % 3 - 1) * 1.6, duration: 0.22, ease: "power3.out" }, T(t));
      tl.to(s, { opacity: 0, duration: 0.25, ease: "power1.in" }, T(t + 0.95 + (i % 4) * 0.12));
    });
    // "…scrubbing clips, hoping." : the scrub bar races, then stalls
    FT("#s02-scrub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T(29.05));
    const stops = [[0, 29.3], [980, 29.55], [260, 29.85], [1400, 30.1], [640, 30.35], [1540, 30.6], [860, 30.85], [1190, 31.2]];
    for (let i = 1; i < stops.length; i++) {
      const [x, t] = stops[i], [px, pt] = stops[i - 1];
      FT("#s02-head", { x: px }, { x, duration: t - pt, ease: "power2.inOut" }, T(pt));
      FT("#s02-fill", { width: px }, { width: x, duration: t - pt, ease: "power2.inOut" }, T(pt));
    }
    for (let i = 0; i < 5; i++) {              // preview thumbnail flicks with the playhead
      FT("#s02-pv" + i, { opacity: 0 }, { opacity: 1, duration: 0.001 }, T(29.3 + i * 0.36));
      if (i < 4) tl.to("#s02-pv" + i, { opacity: 0, duration: 0.001 }, T(29.3 + i * 0.36 + 0.36));   // last frame stays through the stall
    }
    FT("#s02-head", { x: 1190 }, { x: 1196, duration: 0.5, ease: "sine.inOut" }, T(31.2));   // stalls ("hoping")
    tl.to("#s02-wallshade", { opacity: 0.55, duration: 0.6 }, T(30.44));
    // freeze + cut for the help card
    tl.to("#s02-B", { opacity: 0, duration: 0.2, ease: "power1.in" }, T(33.9));

    // ================= C · what Ring's own help page says (34.05 – 39.3) =================
    FT("#s02-help", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, T(34.05));
    tl.to(["#s02-i2", "#s02-i4", "#s02-i5"], { opacity: 0.32, duration: 0.4 }, T(35.3));
    FT("#s02-m1", { scaleX: 0, width: 640 }, { scaleX: 1, width: 640, duration: 0.9, ease: "power2.out" }, T(35.39));
    tl.to("#s02-i1", { x: 10, duration: 0.3, ease: "power2.out" }, T(35.39));
    tl.to("#s02-i1", { opacity: 0.55, x: 0, duration: 0.4 }, T(36.9));
    FT("#s02-m3", { scaleX: 0, width: 590 }, { scaleX: 1, width: 590, duration: 1.3, ease: "power2.out" }, T(37.02));
    tl.to("#s02-i3", { x: 10, duration: 0.3, ease: "power2.out" }, T(37.02));
    tl.to("#s02-help", { opacity: 0, scale: 0.97, duration: 0.3, ease: "power2.in" }, T(39.35));

    // ================= D · the line (39.7 – 43.0) =================
    FT("#s02-l1", { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, T(39.7));
    FT("#s02-l2", { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, T(41.0));
    FT("#s02-lbar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, T(41.5));
    tl.to("#s02-l1", { opacity: 0.55, duration: 0.5 }, T(41.2));

    window.__timelines["s02-problem"] = tl;
  </script>
