<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="880" viewBox="0 0 1640 880">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0b5f8c"/></marker></defs>
<rect width="1640" height="880" fill="#f6f9fb"/>
<text x="40" y="48" font-size="26" font-weight="800" fill="#0b3a55" font-family="DejaVu Sans, Arial, sans-serif">Ring Partner API integration: what Recall calls and receives</text>
<rect x="70" y="80" width="240" height="44" rx="10" fill="#0b3a55"/><text x="190" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif">Ring platform</text><line x1="190" y1="124" x2="190" y2="780" stroke="#b9c7cf" stroke-width="2" stroke-dasharray="6 6"/><rect x="520" y="80" width="240" height="44" rx="10" fill="#0b3a55"/><text x="640" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif">Recall: ring_api.py</text><line x1="640" y1="124" x2="640" y2="780" stroke="#b9c7cf" stroke-width="2" stroke-dasharray="6 6"/><rect x="940" y="80" width="240" height="44" rx="10" fill="#0b3a55"/><text x="1060" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif">Recall: pipeline / memory</text><line x1="1060" y1="124" x2="1060" y2="780" stroke="#b9c7cf" stroke-width="2" stroke-dasharray="6 6"/><rect x="1320" y="80" width="240" height="44" rx="10" fill="#0b3a55"/><text x="1440" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif">Answers</text><line x1="1440" y1="124" x2="1440" y2="780" stroke="#b9c7cf" stroke-width="2" stroke-dasharray="6 6"/><line x1="632" y1="160" x2="198" y2="160" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="151" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">1  POST oauth.ring.com/oauth/token (refresh_token)  →  rotating token pair persisted</text><line x1="198" y1="215" x2="632" y2="215" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="206" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">access token (~4 h), refresh token (~30 d)</text><line x1="632" y1="270" x2="198" y2="270" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="261" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">2  GET /v1/devices?include=status,capabilities  →  cameras + camera-module ids</text><line x1="198" y1="325" x2="632" y2="325" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="316" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">3  Webhook v1.1 motion_detected / button_press  (X-Signature, meta.request_id)</text><line x1="648" y1="380" x2="1052" y2="380" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="850.0" y="371" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">verify HMAC over RAW body · dedupe · 200 within 5 s · queue</text><line x1="632" y1="435" x2="198" y2="435" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="426" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">4  POST media/video/download {timestamp, duration, components}  (200 / 206)</text><line x1="198" y1="490" x2="632" y2="490" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="481" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">MP4 (or 303 → pre-signed image)</text><line x1="648" y1="545" x2="1052" y2="545" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="850.0" y="536" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Nova perceive → Titan re-id → memory graph → watch rules</text><line x1="198" y1="600" x2="632" y2="600" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="591" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">5  device_offline / device_online webhooks</text><line x1="648" y1="655" x2="1052" y2="655" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="850.0" y="646" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">coverage log: 'no detections' ≠ 'nothing happened'</text><line x1="1068" y1="710" x2="1432" y2="710" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="1250.0" y="701" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">Where was Dad last seen? → answer + 'Backyard was offline since 8:15 PM'</text><line x1="632" y1="765" x2="198" y2="765" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415.0" y="756" text-anchor="middle" font-size="12" fill="#223" font-family="DejaVu Sans, Arial, sans-serif">6  GET /v1/history/.../events?page[key]  (backfill, newest first, links.next)</text><rect x="40" y="800" width="1560" height="64" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/><text x="820" y="827" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a00" font-family="DejaVu Sans, Arial, sans-serif">One code path, two backends</text><text x="820" y="850" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">With Ring credentials, RingClient targets api.amazonvision.com. Without them it targets ring_sim.py, a sandbox that speaks the same documented wire formats and sends signed webhooks.</text></svg>