<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="880" viewBox="0 0 1640 880"><defs><marker id="a" markerHeight="8" markerWidth="10" orient="auto" refX="9" refY="4"><path fill="#0b5f8c" d="M0,0 L10,4 L0,8 z"/></marker></defs><rect width="1640" height="880" fill="#f6f9fb"/><text x="40" y="48" fill="#0b3a55" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="800">Ring Partner API integration: what Recall calls and receives</text><rect width="240" height="44" x="70" y="80" fill="#0b3a55" rx="10"/><text x="190" y="108" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Ring platform</text><line x1="190" x2="190" y1="124" y2="780" stroke="#b9c7cf" stroke-dasharray="6 6" stroke-width="2"/><rect width="240" height="44" x="520" y="80" fill="#0b3a55" rx="10"/><text x="640" y="108" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Recall: ring_api.py</text><line x1="640" x2="640" y1="124" y2="780" stroke="#b9c7cf" stroke-dasharray="6 6" stroke-width="2"/><rect width="240" height="44" x="940" y="80" fill="#0b3a55" rx="10"/><text x="1060" y="108" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Recall: pipeline / memory</text><line x1="1060" x2="1060" y1="124" y2="780" stroke="#b9c7cf" stroke-dasharray="6 6" stroke-width="2"/><rect width="240" height="44" x="1320" y="80" fill="#0b3a55" rx="10"/><text x="1440" y="108" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Answers</text><line x1="1440" x2="1440" y1="124" y2="780" stroke="#b9c7cf" stroke-dasharray="6 6" stroke-width="2"/><line x1="632" x2="198" y1="160" y2="160" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="151" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">1 POST oauth.ring.com/oauth/token (refresh_token) → rotating token pair persisted</text><line x1="198" x2="632" y1="215" y2="215" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="206" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">access token (~4 h), refresh token (~30 d)</text><line x1="632" x2="198" y1="270" y2="270" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="261" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">2 GET /v1/devices?include=status,capabilities → cameras + camera-module ids</text><line x1="198" x2="632" y1="325" y2="325" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="316" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">3 Webhook v1.1 motion_detected / button_press (X-Signature, meta.request_id)</text><line x1="648" x2="1052" y1="380" y2="380" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="850" y="371" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">verify HMAC over RAW body · dedupe · 200 within 5 s · queue</text><line x1="632" x2="198" y1="435" y2="435" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="426" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">4 POST media/video/download {timestamp, duration, components} (200 / 206)</text><line x1="198" x2="632" y1="490" y2="490" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="481" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">MP4 (or 303 → pre-signed image)</text><line x1="648" x2="1052" y1="545" y2="545" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="850" y="536" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">Nova perceive → Titan re-id → memory graph → watch rules</text><line x1="198" x2="632" y1="600" y2="600" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="591" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">5 device_offline / device_online webhooks</text><line x1="648" x2="1052" y1="655" y2="655" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="850" y="646" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">coverage log: &apos;no detections&apos; ≠ &apos;nothing happened&apos;</text><line x1="1068" x2="1432" y1="710" y2="710" stroke="#1f7a55" stroke-width="2.4" marker-end="url(#a)"/><text x="1250" y="701" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">Where was Dad last seen? → answer + &apos;Backyard was offline since 8:15 PM&apos;</text><line x1="632" x2="198" y1="765" y2="765" stroke="#0b5f8c" stroke-width="2.4" marker-end="url(#a)"/><text x="415" y="756" fill="#223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle">6 GET /v1/history/.../events?page[key] (backfill, newest first, links.next)</text><rect width="1560" height="64" x="40" y="800" fill="#fff4e0" stroke="#e08a00" stroke-width="2" rx="12"/><text x="820" y="827" fill="#7a4a00" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">One code path, two backends</text><text x="820" y="850" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle">With Ring credentials, RingClient targets api.amazonvision.com. Without them it targets ring_sim.py, a sandbox that speaks the same documented wire formats and sends signed webhooks.</text></svg>