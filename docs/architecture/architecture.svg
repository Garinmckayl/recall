ces/{id}/events</text><text x="195.0" y="475" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">POST media/video|image/download</text><rect x="55" y="520" width="280" height="90" rx="12" fill="#ffffff" stroke="#0f7fb8" stroke-width="2"/><text x="195.0" y="548" text-anchor="middle" font-size="17" font-weight="700" fill="#0b3a55" font-family="DejaVu Sans, Arial, sans-serif">OAuth (oauth.ring.com)</text><text x="195.0" y="572" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">refresh_token, ~4 h access token</text><text x="195.0" y="591" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">proactive + on-401 refresh</text><rect x="400" y="80" width="1170" height="560" rx="16" fill="#ffffff" stroke="#9fb3bf" stroke-width="2"/><text x="985" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#556" font-family="DejaVu Sans, Arial, sans-serif">RECALL  (FastAPI, SQLite, one EC2 host)</text><rect x="425" y="135" width="230" height="110" rx="12" fill="#e6f4ee" stroke="#1f7a55" stroke-width="2"/><text x="540.0" y="163" text-anchor="middle" font-size="17" font-weight="700" fill="#0b3a55" font-family="DejaVu Sans, Arial, sans-serif">ring_api.py</text><text x="540.0" y="187" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">verify HMAC raw body</text><text x="540.0" y="206" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">dedupe request_id + camera/time</text><text x="540.0" y="225" text-anchor="middle" font-size="13" fill="#3d4a52" font-family="DejaVu Sans, Arial, sans-serif">429 backoff, 303/206 handling</text><rect x="425" y="285" width="230" height="100" rx="12" fill="#e6f4ee" stroke="#1f7a55" stroke-width="2"/><text x="540.0" y="313" text-anchor="middle" font-size="17" font-weight="700" fill="#0b3a55" font-family="DejaVu Sans, Arial, s